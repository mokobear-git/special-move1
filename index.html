<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>WORLD CLASH</title>
<!--STYLE-->
<style>
  :root { --bg: #000; --fg: #fff; --btn: rgba(255,255,255,0.14); --btn-on: rgba(255,207,58,0.55); --line: rgba(255,255,255,0.35); --p: #ff6b5a; --k: #5ab4ff; --sp: #ffcf3a; color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); overflow: hidden; overscroll-behavior: none; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #app { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #game { display: block; width: min(100vw, 177.78vh); height: min(56.25vw, 100vh); background: #000; outline: none; touch-action: none; }
  #touch { position: absolute; inset: 0; pointer-events: none; font-family: "Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif; }
  #touch[hidden] { display: none !important; }
  #touch .grp { pointer-events: auto; touch-action: none; }
  #pad { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 14px; width: 140px; height: 140px; border-radius: 50%; background: var(--btn); border: 2px solid var(--line); }
  #knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(255,255,255,0.45); transition: transform 0.04s; }
  #btns { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 10px; display: grid; grid-template-columns: repeat(3, 52px); gap: 8px; }
  .b { white-space: nowrap; width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--line); background: var(--btn); color: var(--fg); font: bold 13px/1 inherit; display: flex; align-items: center; justify-content: center; text-shadow: 0 1px 2px #000; padding: 0; }
  .b.p { border-color: var(--p); } .b.k { border-color: var(--k); } .b.s { border-color: var(--sp); }
  .b.wide { grid-column: span 1; }
  .b.on { background: var(--btn-on); }
  #sys { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 166px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  #sys .b { width: auto; height: 30px; border-radius: 15px; padding: 0 14px; font-size: 12px; }
  /* 縦持ち：画面の下に操作パネル */
  #app.portrait { justify-content: flex-start; }
  #app.portrait #touch { position: relative; inset: auto; flex: 1; width: 100%; }
  #app.portrait #pad { left: max(18px, env(safe-area-inset-left, 0px)); bottom: auto; top: 50%; transform: translateY(-50%); width: 150px; height: 150px; }
  #app.portrait #btns { right: max(14px, env(safe-area-inset-right, 0px)); bottom: auto; top: 50%; transform: translateY(-50%); grid-template-columns: repeat(3, 58px); }
  #app.portrait .b { width: 58px; height: 58px; }
  #app.portrait #sys { top: 10px; bottom: auto; left: 50%; transform: translateX(-50%); flex-direction: row; }
  #app.portrait #sys .b { width: auto; height: 32px; }
</style>
<!--/STYLE-->
</head>
<body>
<!--BODY-->
<div id="app">
  <canvas id="game" width="960" height="540" tabindex="0"></canvas>
  <div id="touch" hidden>
    <div id="sys" class="grp">
      <button class="b" data-k="start">決定 / START</button>
      <button class="b" data-k="esc">戻る / ポーズ</button>
      <button class="b" data-k="bgm">BGM</button>
    </div>
    <div id="pad" class="grp"><div id="knob"></div></div>
    <div id="btns" class="grp">
      <button class="b p" data-k="lp">弱P</button>
      <button class="b p" data-k="mp">中P</button>
      <button class="b p" data-k="hp">強P</button>
      <button class="b k" data-k="lk">弱K</button>
      <button class="b k" data-k="mk">中K</button>
      <button class="b k" data-k="hk">強K</button>
      <button class="b s" data-k="sp">SP</button>
      <button class="b s" data-k="sa">SA</button>
      <button class="b" data-k="dbg" style="visibility:hidden"></button>
    </div>
  </div>
</div>
<!--/BODY-->
<script src="game.js"></script>
</body>
</html>
